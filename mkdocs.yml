  - Reproduction audit: reproduction-audit.md
  - Reports:
      - Multi-horizon source inspection: reports/multi-horizon-decision-2026-08-10/source-inspection.md
  - References:
      - Reference index: references/README.md
      - AgentX notes: references/agentx-paper-notes.md
      - Debang minute GRU notes: references/debang-minute-gru-notes.md
      - DeepLOB notes: references/deeplob-paper-notes.md
