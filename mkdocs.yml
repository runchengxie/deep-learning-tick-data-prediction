site_name: Quant Deep Learning
site_description: Independent end-to-end quantitative deep-learning research for structured market data
site_url: https://runchengxie.github.io/quant-deep-learning/
repo_url: https://github.com/runchengxie/quant-deep-learning
repo_name: runchengxie/quant-deep-learning
docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  /superpowers/**

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Documentation index: documentation-index.md
  - Project status: project-status.md
  - Architecture:
      - Data boundary: architecture/data-boundary.md
      - Model catalog: model-catalog.md
  - Next-day research:
      - Cross-sectional prediction: nextday/cross-sectional-prediction.md
      - Event-stream models: nextday/eventstream.md
      - H5 rolling roadmap: nextday/h5-rolling-eventstream-roadmap.md
      - Hardware and experiment roadmap: nextday/hardware-constraints-and-experiment-roadmap.md
      - Multi-horizon data expansion: nextday/multi-horizon-data-expansion-roadmap.md
      - 100M raw-1000 benchmark: nextday/nextday-100m-raw1000-benchmark.md
      - Raw-200 pipeline: nextday/raw-200-end-to-end-pipeline.md
      - Raw-data expansion: nextday/raw-data-expansion-roadmap.md
  - Research:
      - Research roadmap: research/topk-agentx-research-roadmap.md
      - Experiment log: research/experiment-log.md
      - Event-stream gradient audit: research/eventstream-gradient-audit.md
      - Event-stream label scale: research/eventstream-label-scale.md
      - Event-stream trading diagnostics: research/eventstream-signal-trading-diagnostics.md
      - External L2 comparison: research/external-l2-research-comparison.md
      - Historical data eligibility: research/historical-data-eligibility-2026-08-27.md
      - M3 event-stream representation: research/m3-eventstream-representation.md
      - Opening coverage inventory: research/opening-coverage-inventory-2026-08-27.md
      - Resource strategy: research/resource-strategy-and-pilot-gates.md
      - Shanghai opening contract audit: research/shanghai-opening-contract-audit-2026-08-27.md
      - AgentX research contract: research/topk-agentx-m0-research-contract.md
      - Portfolio evaluator: research/topk-agentx-m1-portfolio-evaluator.md
      - Deterministic loop: research/topk-agentx-m2a-deterministic-loop.md
      - Locked-test approval: research/topk-agentx-m2b-locked-approval.md
      - Executor comparison: research/topk-agentx-m2c-executors-comparison.md
      - Registry context: research/topk-agentx-m2d-registry-context.md
      - Top-K diagnostics: research/topk-agentx-m3-topk-diagnostics.md
  - Development:
      - Development guide: dev/development-guide.md
      - Colab CLI automation: dev/colab-cli-automation.md
      - Historical Colab snapshots: dev/historical-colab-snapshots.md
  - Operations:
      - Development guide: operations/development-guide.md
