# Top-100 容量与窗口 2×2 矩阵的 1M/raw-200 控制格。
# 从同一 raw-1000 工作集只读取最后两个 chunk，股票日与标签保持完全一致。

manifest_path: /content/nextday-raw-1000-pilot-2021-2025-top100/manifest.json
input_last_chunks: 2
train_start: "2021-01-01"
train_end: "2023-12-31"
val_start: "2024-01-01"
val_end: "2024-12-31"
test_start: "2025-01-01"
test_end: "2025-12-31"

epochs: 30
batch_size: 32
lr: 0.0001
weight_decay: 0.0001
patience: 8
seed: 0
num_workers: 2
device: cuda
resume: true
evaluate_test: false
verify_data_checksums: true

checkpoint_dir: /content/drive/MyDrive/deep-learning-tick-data-prediction/ticknet-runs/raw-1000-top100-capacity-matrix/1m-raw200
checkpoint_name: raw-200-top100-dual-head-capacity_1m-matrix
conv_channels: 32
inception_channels: 64
intraday_embedding_size: 320
day_hidden_size: 192
day_layers: 1
dropout: 0.1
class_weighting: balanced
selection_metric: daily_rank_ic_mean
min_symbols_per_day: 50
portfolio_quantile: 0.1
classification_loss_weight: 1.0
regression_loss_weight: 0.5
gradient_accumulation_steps: 1
amp: true
