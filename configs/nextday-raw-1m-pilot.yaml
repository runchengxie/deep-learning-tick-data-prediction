# raw-200 百万参数容量压力测试。
# 复用已查看过结果的 2024 pilot，只能作为开发诊断，不能重新称为 locked test。

manifest_path: ./data/nextday-raw-pilot-2024-top100/manifest.json
train_start: "2024-01-01"
train_end: "2024-06-30"
val_start: "2024-07-01"
val_end: "2024-09-30"
test_start: "2024-10-01"
test_end: "2024-12-31"

epochs: 10
batch_size: 32
lr: 0.001
weight_decay: 0.0001
patience: 4
seed: 0
num_workers: 2
device: cuda
resume: true
evaluate_test: false
verify_data_checksums: true

checkpoint_dir: ./checkpoints-nextday-1m-pilot
checkpoint_name: raw-200-1m-pilot-2024-top100
conv_channels: 32
inception_channels: 64
intraday_embedding_size: 320
day_hidden_size: 192
day_layers: 1
dropout: 0.1
class_weighting: balanced
selection_metric: daily_rank_ic_mean
min_symbols_per_day: 80
portfolio_quantile: 0.1
classification_loss_weight: 1.0
regression_loss_weight: 0.5
gradient_accumulation_steps: 1
amp: true
