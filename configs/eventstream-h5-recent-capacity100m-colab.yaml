# Recent B0 只使用 2025-08 pack，不读取 2025-11 validation、2025-12 OOS 或 2026 locked。

pack_root: /content/ticknet-eventstream/top400-h5-recent/pack
label_path: /content/ticknet-eventstream/top400-h5-recent/fold-labels/h5.parquet
train_start: 20250801
train_end: 20250831
val_start: 20251101
val_end: 20251130
test_start: 20251201
test_end: 20251231

model: capacity100m
seq_len: 512
min_events: 256
samples_per_day: 2000
eval_tickers: 0

epochs: 20
batch_size: 8
lr: 0.0003
weight_decay: 0.1
patience: 4
seed: 0
num_workers: 2
device: cuda
amp: true
gradient_accumulation_steps: 1
resume: false

checkpoint_dir: /content/ticknet-results/checkpoints
checkpoint_name: eventstream-top400-h5-capacity100m-recent
selection_metric: daily_rank_ic_mean
min_symbols_per_day: 100
