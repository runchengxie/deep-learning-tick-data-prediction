# 事件流基础模型示例配置。
# pack_root 指向 ticknet-eventstream-pack 的打包产物目录。

pack_root: /mnt/data/hdd6t/quant-data-lake/derived/l2_eventstream/v2
label_path: /mnt/data/hdd6t/quant-data-lake/derived/l2_eventstream/label.parquet
train_start: 20210104
train_end: 20210228
val_start: 20210301
val_end: 20210331
test_start: 20210401
test_end: 20210430

model: probe25m
seq_len: 512
min_events: 256
samples_per_day: 2000
eval_tickers: 200

# M3-inspired 表征默认关闭，便于与现有实验做单变量 A/B。
use_lob_prefix: false
use_session_anchors: false
use_vq: false
vq_codebook_size: 1024
vq_dim: 64
vq_loss_weight: 0.25

epochs: 20
batch_size: 8
lr: 0.0003
weight_decay: 0.1
patience: 4
seed: 0
num_workers: 0
device: cuda
amp: true
gradient_accumulation_steps: 1
resume: true

checkpoint_dir: ./checkpoints-eventstream
checkpoint_name: eventstream
selection_metric: daily_rank_ic_mean
min_symbols_per_day: 20
