# 真实移动硬盘 snapshot 的小型端到端烟雾数据集。
# 覆盖 9 个交易日、动态前 20 股票，足够构造不重叠的 train/val/test。

snapshot_root: /mnt/data/hdd6t/quant-data-lake/raw/cn_a_share_level2/snapshot
basic_root: /mnt/data/hdd6t/quant-data-lake/raw/cn_a_share_level2/basic
benchmark_path: /mnt/data/hdd6t/quant-data-lake/reference/cn_market_reference/csi_all_a_000985.CSI.parquet
output_dir: ./data/nextday-raw-smoke

start_date: "2024-01-02"
