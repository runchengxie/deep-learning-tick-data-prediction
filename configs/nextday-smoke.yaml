# 使用真实 200-tick pilot 验证训练、验证、测试和 checkpoint 闭环。
# 样本极少，输出指标不代表可交易性。

manifest_path: ./data/nextday-raw-smoke/manifest.json
train_start: "2024-01-02"
train_end: "2024-01-05"
val_start: "2024-01-08"
val_end: "2024-01-10"
test_start: "2024-01-11"
test_end: "2024-01-15"

epochs: 2
batch_size: 8
lr: 0.001
weight_decay: 0.0001
patience: 2
seed: 0
num_workers: 0
device: cpu
resume: false

checkpoint_dir: ./checkpoints-nextday-smoke
checkpoint_name: raw-200-smoke
intraday_embedding_size: 64
day_hidden_size: 64
day_layers: 1
dropout: 0.1
class_weighting: balanced
selection_metric: daily_rank_ic_mean
min_symbols_per_day: 10
portfolio_quantile: 0.2
classification_loss_weight: 1.0
regression_loss_weight: 0.5
gradient_accumulation_steps: 1
amp: false
