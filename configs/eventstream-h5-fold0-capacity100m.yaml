# 首个 3/1/1 eventstream H5 fold。H5 用于训练与 checkpoint 选择，H3 单独监控。

pack_root: /mnt/data/hdd6t/quant-data-lake/derived/l2_eventstream/top400-h5-v1
label_path: artifacts/eventstream-h5-fold0/fold-labels/h5.parquet
monitor_label_path: artifacts/eventstream-h5-fold0/fold-labels/h3.parquet
