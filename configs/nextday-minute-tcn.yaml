manifest_path: ./data/nextday-minute-l2-2024-top100/manifest.json
train_start: "2024-01-01"
train_end: "2024-06-30"
val_start: "2024-07-01"
val_end: "2024-09-30"
test_start: "2024-10-01"
test_end: "2024-12-31"

epochs: 15
batch_size: 64
lr: 0.001
weight_decay: 0.0001
patience: 5
seed: 0
num_workers: 2
device: cpu
resume: true
evaluate_test: false
verify_data_checksums: true

checkpoint_dir: ./checkpoints-nextday-minute-tcn
checkpoint_name: minute-tcn-2024-top100
hidden_channels: 64
tcn_layers: 4
kernel_size: 3
dropout: 0.1
class_weighting: balanced
selection_metric: daily_rank_ic_mean
# 与 HGB 分钟基线保持同一日度横截面口径。
min_symbols_per_day: 50
portfolio_quantile: 0.1
classification_loss_weight: 1.0
regression_loss_weight: 0.5
gradient_accumulation_steps: 1
amp: false
