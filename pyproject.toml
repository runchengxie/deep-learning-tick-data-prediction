[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-learning-tick-data-prediction"
version = "0.2.0"
description = "PyTorch DeepLOB 模型与 A 股次日横截面方向预测"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "polars>=1.0",
]

[project.optional-dependencies]
dev = [
    "nbformat>=5.10,<6",
    "pre-commit>=4.0,<5",
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "ruff>=0.16,<0.17",
    "ty>=0.0.65,<0.1",
    "nbqa>=1.8,<2",
]

[project.scripts]
ticknet-fi2010-train = "legacy.fi2010_train:main"
ticknet-nextday-train = "ticknet.nextday.train:main"
ticknet-nextday-evaluate = "ticknet.nextday.train:evaluate_main"
ticknet-nextday-evaluate-horizons = "ticknet.nextday.horizon_cli:main"
ticknet-minute-tcn-train = "ticknet.nextday.train_tcn:main"
ticknet-minute-gru-train = "ticknet.nextday.train_gru:main"
ticknet-minute-tcn-evaluate = "ticknet.nextday.train_tcn:evaluate_main"
ticknet-minute-gru-evaluate = "ticknet.nextday.train_gru:evaluate_main"
ticknet-research = "ticknet.research.cli:main"
ticknet-nextday-prepare-snapshot = "ticknet.nextday.raw_snapshot:main"
ticknet-nextday-prepare-horizon-labels = "ticknet.nextday.horizon_labels:main"
ticknet-nextday-predict = "ticknet.nextday.inference:main"
ticknet-eventstream-pack = "ticknet.eventstream.pack:main"
ticknet-eventstream-train = "ticknet.eventstream.train:main"
ticknet-eventstream-export-predictions = "ticknet.eventstream.export:main"

[tool.setuptools.packages.find]
where = ["src", "."]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "C90", "PT", "SIM", "RUF"]
ignore = [
    "RUF001", # 中文字符串使用中文标点
    "RUF002", # 中文文档字符串使用中文标点
    "RUF003", # 中文注释使用中文标点
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"scripts/smoke_test.py" = ["E402"]
"scripts/prepare_minute_shards.py" = ["C901"]
"src/ticknet/nextday/minute_tcn.py" = ["C901"]
"src/ticknet/nextday/train_tcn.py" = ["C901"]
"src/ticknet/nextday/train_gru.py" = ["C901"]
"legacy/scripts/fi2010_smoke_test.py" = ["E402"]
# 以下两处高复杂度是已知技术债，将在 PR-3 拆分上帝文件（dataset.py / train.py）时解决。
"src/ticknet/nextday/dataset.py" = ["C901"]
"src/ticknet/nextday/train.py" = ["C901"]
# 事件流训练入口与 nextday/train.py 同类为已知复杂度技术债，后续拆分。
"src/ticknet/eventstream/train.py" = ["C901"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["ticknet"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[[tool.ty.overrides]]
include = ["notebooks/**", "legacy/notebooks/**"]
rules = { unresolved-import = "ignore" }

[[tool.ty.overrides]]
include = ["src/ticknet/research/agents/client.py"]
rules = { unresolved-import = "ignore" }
