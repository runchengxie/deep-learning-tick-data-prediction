[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deeplob-reproduction"
version = "0.2.0"
description = "PyTorch reproduction of DeepLOB on FI-2010"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "nbformat>=5.10,<6",
    "pre-commit>=4.0,<5",
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "ruff>=0.16,<0.17",
    "ty>=0.0.65,<0.1",
]

[project.scripts]
deeplob-train = "deeplob.train:main"
deeplob-nextday-train = "deeplob.nextday.train:main"
deeplob-nextday-evaluate = "deeplob.nextday.train:evaluate_main"
deeplob-nextday-prepare-snapshot = "deeplob.nextday.raw_snapshot:main"
deeplob-nextday-predict = "deeplob.nextday.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PT", "SIM", "RUF"]
ignore = [
    "RUF001", # 中文字符串使用中文标点
    "RUF002", # 中文文档字符串使用中文标点
    "RUF003", # 中文注释使用中文标点
]

[tool.ruff.lint.per-file-ignores]
"scripts/smoke_test.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["deeplob"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[[tool.ty.overrides]]
include = ["notebooks/**"]
rules = { unresolved-import = "ignore" }
