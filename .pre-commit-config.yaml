# 提交前运行快速检查，推送前运行完整本地质量门禁。
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.65
    hooks:
      - id: ty
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: local-quality-gate
        name: 本地完整质量门禁
        entry: python scripts/check.py
        language: system
        pass_filenames: false
        stages: [pre-push]
