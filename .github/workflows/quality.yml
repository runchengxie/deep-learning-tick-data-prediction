name: 质量门禁

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 完整门禁
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 uv 和 Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: 安装锁定依赖
        run: uv sync --locked --extra dev --python 3.12
      - name: 检查基础文件卫生
        run: uv run pre-commit run --all-files
      - name: 运行完整质量门禁
        run: uv run python scripts/check.py

  python310:
    name: Python 3.10 兼容性
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 uv 和 Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.10"
      - name: 安装锁定依赖
        run: uv sync --locked --extra dev --python 3.10
      - name: 运行带覆盖率的测试
        run: uv run python -m pytest --cov --cov-report=term-missing
      - name: 运行冒烟检查
        run: uv run python scripts/smoke_test.py

  dependency-audit:
    name: Python ${{ matrix.python-version }} 依赖安全审计
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 uv 和 Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: 导出锁定依赖
        run: >-
          uv export --locked --all-extras --no-emit-project
          --output-file "${RUNNER_TEMP}/requirements-audit.txt" > /dev/null
      - name: 审计已知漏洞
        run: >-
          uvx --python "${{ matrix.python-version }}"
          --from pip-audit==2.10.0 pip-audit
          --disable-pip --require-hashes
          --requirement "${RUNNER_TEMP}/requirements-audit.txt"
