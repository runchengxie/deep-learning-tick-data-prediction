name: Pull request quality

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "config/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "config/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-learning-tick-data-prediction-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Run Ruff
        run: |
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev ruff format --check .

      - name: Run ty
        run: uv run --locked --extra dev ty check

      - name: Run shared code-quality metrics
        run: uv run --locked --extra dev research-code-quality --scope src --scope scripts --scope tests --baseline .code-quality-baseline.json --ratchet --json

      - name: Run tests with coverage
        run: uv run --locked --extra dev pytest --cov --cov-report=term-missing

      - name: Compile public Python sources
        run: python -m compileall -q src scripts
