name: Pull request quality

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "config/**"
      - "web/**"
      - "README.md"
      - "AGENTS.md"
      - "MIGRATION-STATUS.md"
      - "mkdocs.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "config/**"
      - "web/**"
      - "README.md"
      - "AGENTS.md"
      - "MIGRATION-STATUS.md"
      - "mkdocs.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-deep-learning-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository history for changed-file checks
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Check changed-file hygiene
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BEFORE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z "$base" "$GITHUB_SHA")
          if [ "${#files[@]}" -gt 0 ]; then
            uv run --locked --extra dev python scripts/ci_hygiene.py "${files[@]}"
          fi

      - name: Run Ruff
        run: |
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev ruff format --check .

      - name: Lint notebook code
        run: uv run --locked --extra dev nbqa ruff --extend-ignore=E402,B018 .

      - name: Run ty
        run: uv run --locked --extra dev ty check

      - name: Run shared code-quality metrics
        run: uv run --locked --extra dev research-code-quality --scope src --scope scripts --scope tests --baseline .code-quality-baseline.json --ratchet --json

      - name: Run tests with coverage
        run: uv run --locked --extra dev pytest --cov --cov-report=term-missing

      - name: Run synthetic model smoke checks
        run: uv run python scripts/smoke_test.py

      - name: Compile public Python sources
        run: python -m compileall -q src scripts
